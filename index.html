<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Склад — Калькулятор и База</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Склад">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg: #F4F3F1;
    --surface: #FFFFFF;
    --ink: #121212;
    --ink-soft: #8B8A87;
    --accent: #FF5A2E;
    --accent-dark: #E04A22;
    --steel: #5B6B72;
    --line: rgba(18,18,18,.07);
    --ok: #2F8F5B;
    --danger: #E24C4C;
    --radius: 20px;
    --shadow: 0 2px 10px rgba(18,18,18,.05), 0 1px 2px rgba(18,18,18,.04);
    --shadow-lg: 0 16px 40px rgba(18,18,18,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    letter-spacing: -0.01em;
  }
  #app{
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
  }
  header.top{
    padding: calc(20px + env(safe-area-inset-top)) 22px 20px;
    background: var(--ink);
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  header.top h1{
    margin:0;
    font-size: 24px;
    letter-spacing: -0.02em;
    font-weight: 800;
    position:relative;
  }
  header.top p{
    margin:5px 0 0;
    font-size: 13.5px;
    color: rgba(255,255,255,.55);
    position:relative;
    max-width: 70%;
    font-weight: 500;
  }
  header.top::before{
    content:"";
    position:absolute; left:22px; bottom:0;
    width:28px; height:4px; border-radius:4px 4px 0 0;
    background: var(--accent);
  }

  main{ flex:1; padding: 20px 16px 8px; }
  .screen{ display:none; }
  .screen.active{ display:block; animation: fadein .2s ease-out; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .card{
    background: var(--surface);
    border: none;
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .card h2{
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-soft);
  }
  .field{ margin-bottom: 12px; }
  .field label{
    display:block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input[type=text], input[type=number], input[type=date], select{
    width:100%;
    padding: 13px 14px;
    border: none;
    border-radius: 13px;
    font-size: 16px;
    background: #F1F0ED;
    color: var(--ink);
    font-family: inherit;
    font-weight: 600;
  }
  input:focus, select:focus, textarea:focus{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    background: #fff;
  }
  .hint{ font-size: 12px; color: var(--ink-soft); margin-top: 4px; font-weight:600; }

  button.primary{
    width:100%;
    padding: 15px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  button.primary:active{ background: var(--accent-dark); }
  button.ghost{
    background: #F1F0ED;
    border: none;
    color: var(--ink);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 700;
  }
  button.text{
    background:none; border:none; color: var(--accent-dark); font-size: 13.5px; font-weight:700; padding:6px;
  }

  .result{
    margin-top: 16px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .result .big-row{
    display:flex; gap: 10px;
  }
  .stat{
    flex:1;
    background: var(--ink);
    border: none;
    border-radius: 16px;
    padding: 16px 12px;
    text-align:center;
  }
  .stat .num{
    font-family: -apple-system, sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    line-height:1.1;
    letter-spacing: -0.02em;
  }
  .stat .lbl{ font-size: 11px; color: rgba(255,255,255,.6); margin-top: 4px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .result .meta{
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align:center;
    font-weight:500;
  }
  .result .meta b{ color: var(--ink); }

  .searchbar{
    display:flex; gap:8px; margin-bottom: 12px;
  }
  .searchbar input{ flex:1; }

  .item-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 13px 4px;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .item-row:last-child{ border-bottom:none; }
  .item-thumb{
    width:46px; height:46px; border-radius:12px; flex-shrink:0;
    background: #F1F0ED center/cover no-repeat;
    border: none;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; color: var(--ink-soft);
  }
  .item-main{ min-width:0; flex:1; }
  .item-name{ font-weight:700; font-size: 14.5px; letter-spacing:-0.01em; }
  .item-cat{
    display:inline-block; margin-left:6px; font-size:10px; font-weight:800;
    text-transform:uppercase; letter-spacing:.03em;
    color: var(--steel); background:#EAF0EF; padding:3px 7px; border-radius:6px; vertical-align:1px;
  }
  .item-loc{ font-size: 13px; color: var(--ink-soft); margin-top:3px; font-weight:500; }
  .item-qty{ font-size: 11.5px; color: var(--ok); margin-top:3px; font-weight:700; }
  .item-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    width:32px; height:32px; border-radius:10px; border:none;
    background:#F1F0ED; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .empty{
    text-align:center; padding: 32px 10px; color: var(--ink-soft); font-size:13.5px; font-weight:500;
  }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }

  nav.tabbar{
    position: fixed; left:16px; right:16px; bottom: calc(14px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: none;
    box-shadow: var(--shadow-lg);
    border-radius: 24px;
    padding: 10px 8px;
    display:flex;
    max-width: 488px;
    margin: 0 auto;
  }
  nav.tabbar button{
    flex:1; background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0;
    color: var(--ink-soft);
    font-size: 10.5px;
    font-weight:700;
    border-radius: 14px;
  }
  nav.tabbar button.active{ color: var(--ink); background: var(--bg); }
  nav.tabbar button.active .glyph{ color: var(--accent); }
  nav.tabbar .glyph{ font-size:19px; }

  dialog#form-dialog{
    border:none; border-radius: 24px 24px 0 0;
    width:100%; max-width:520px;
    padding:0; margin: auto auto 0;
    box-shadow: var(--shadow-lg);
  }
  dialog#form-dialog::backdrop{ background: rgba(10,10,10,.5); }
  .sheet{ padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); }
  .sheet-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .sheet-head h3{ margin:0; font-size:17px; font-weight:800; letter-spacing:-0.01em; }
  .photo-block{ display:flex; align-items:center; gap:14px; margin-bottom: 16px; }
  .photo-preview{
    width:76px; height:76px; border-radius:16px; flex-shrink:0;
    background: #F1F0ED center/cover no-repeat;
    border: none;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color: var(--ink-soft);
  }
  .photo-actions{ display:flex; flex-direction:column; gap:8px; }

  .toast{
    position:fixed; left:50%; bottom: 110px; transform:translateX(-50%);
    background: var(--ink); color:#fff; padding:11px 18px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition: opacity .2s, bottom .2s;
    z-index: 50;
    box-shadow: var(--shadow-lg);
  }
  .toast.show{ opacity:1; bottom:130px; }

  .item-row{ cursor:pointer; }

  dialog#detail-dialog{
    border:none; border-radius: 24px;
    width:calc(100% - 32px); max-width:480px;
    padding:0; margin:auto;
    box-shadow: var(--shadow-lg);
    overflow:hidden;
  }
  dialog#detail-dialog::backdrop{ background: rgba(10,10,10,.55); }
  .detail-photo{
    width:100%; aspect-ratio: 1 / 1; max-height:50vh;
    background: #F1F0ED center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    font-size:40px; color: var(--ink-soft);
  }
  .detail-body{ padding: 20px 22px calc(20px + env(safe-area-inset-bottom)); }
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px; }
  .detail-head h3{ margin:0; font-size:19px; font-weight:800; letter-spacing:-0.01em; line-height:1.3; }
  .detail-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .detail-row:last-of-type{ border-bottom:none; }
  .detail-row .k{ color: var(--ink-soft); font-weight:500; }
  .detail-row .v{ font-weight:700; text-align:right; }
  .detail-actions{ display:flex; gap:10px; margin-top:18px; }
  .detail-actions button{ flex:1; }

  /* Stock Slider Controls */
  .stock-control-box {
    background: #F8F7F5;
    border-radius: 16px;
    padding: 14px;
    margin: 14px 0;
    border: 1px solid var(--line);
  }
  .stock-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--ink-soft);
    letter-spacing: .04em;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }
  .stock-slider-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stock-slider-wrapper input[type=range] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
    height: 6px;
  }
  .stock-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: none;
    background: var(--surface);
    box-shadow: var(--shadow);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stock-btn:active {
    background: #EAE8E3;
  }
  .stock-val-display {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    margin-top: 6px;
  }

  /* Deliveries */
  .delivery-row{
    padding: 13px 4px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .delivery-row:last-child{ border-bottom:none; }
  .delivery-date{ font-weight:700; font-size:14.5px; letter-spacing:-0.01em; }
  .delivery-note{
    font-size: 13px; color: var(--ink-soft); margin-top:4px; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .delivery-meta{ font-size:11px; color: var(--accent-dark); margin-top:5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }

  .photo-gallery{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 14px; }
  .gallery-tile{
    width:74px; height:74px; border-radius:14px; position:relative;
    background: #F1F0ED center/cover no-repeat;
    border: none;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color: var(--ink-soft);
  }
  .gallery-tile.add-tile{ background:#F1F0ED; border: 1.5px dashed var(--ink-soft); }
  .gallery-tile .rm{
    position:absolute; top:-6px; right:-6px;
    width:20px; height:20px; border-radius:50%;
    background: var(--danger); color:#fff; font-size:11px;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--surface);
  }

  #photo-lightbox{
    display:none; position:fixed; inset:0; z-index:100;
    background: rgba(8,8,8,.94);
    align-items:center; justify-content:center;
  }
  #photo-lightbox.show{ display:flex; }
  #photo-lightbox img{ max-width:92%; max-height:80vh; border-radius:14px; }
  #photo-lightbox .lb-close{
    position:absolute; top: calc(16px + env(safe-area-inset-top)); right:16px;
    width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.15);
    color:#fff; border:none; font-size:18px;
  }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <h1 id="page-title">Калькулятор плитки</h1>
    <p id="page-sub">Кафель · ламинат · двери</p>
  </header>

  <main>
    <!-- CALCULATOR -->
    <section class="screen active" id="screen-calc">
      <div class="card">
        <h2>Размер плитки</h2>
        <div class="row2">
          <div class="field">
            <label>Ширина, см</label>
            <input type="number" inputmode="decimal" id="c-w" placeholder="напр. 60">
          </div>
          <div class="field">
            <label>Высота, см</label>
            <input type="number" inputmode="decimal" id="c-h" placeholder="напр. 120">
          </div>
        </div>
        <div class="field">
          <label>Плиток в одной пачке, шт</label>
          <input type="number" inputmode="numeric" id="c-pack" placeholder="напр. 4">
        </div>
        <div class="row2">
          <div class="field">
            <label>Нужно клиенту, м²</label>
            <input type="number" inputmode="decimal" id="c-need" placeholder="напр. 25">
          </div>
          <div class="field">
            <label>Запас, % (0 = без запаса)</label>
            <input type="number" inputmode="numeric" id="c-margin" value="0">
          </div>
        </div>
        <button class="primary" onclick="calcTiles()">Рассчитать</button>

        <div class="result" id="c-result" style="display:none">
          <div class="big-row">
            <div class="stat"><div class="num" id="r-packs">0</div><div class="lbl">пачек выдать</div></div>
            <div class="stat"><div class="num" id="r-loose">0</div><div class="lbl">штук россыпью</div></div>
          </div>
          <div class="meta" id="r-meta"></div>
        </div>
      </div>
    </section>

    <!-- WAREHOUSE -->
    <section class="screen" id="screen-store">
      <div class="toolbar">
        <span class="hint" id="store-count">0 позиций в базе</span>
        <span>
          <button class="text" onclick="exportData()">Экспорт</button>
          <button class="text" onclick="document.getElementById('import-file').click()">Импорт</button>
          <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(event)">
        </span>
      </div>

      <div class="searchbar">
        <input type="text" id="search-input" placeholder="Поиск: Fresco 120x60…" oninput="renderItems()">
      </div>

      <div class="card" style="padding:6px 12px;">
        <div id="items-list"></div>
      </div>

      <button class="primary" onclick="openForm()">+ Добавить товар</button>
    </section>

    <!-- DELIVERIES -->
    <section class="screen" id="screen-deliveries">
      <div class="toolbar">
        <span class="hint" id="deliveries-count">0 поставок</span>
      </div>

      <div class="card" style="padding:6px 12px;">
        <div id="deliveries-list"></div>
      </div>

      <button class="primary" onclick="openDeliveryForm()">+ Новая поставка</button>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" id="tab-calc" onclick="showScreen('calc')">
      <span class="glyph">▦</span>Калькулятор
    </button>
    <button class="tab-btn" id="tab-store" onclick="showScreen('store')">
      <span class="glyph">▤</span>База склада
    </button>
    <button class="tab-btn" id="tab-deliveries" onclick="showScreen('deliveries')">
      <span class="glyph">▧</span>Поставки
    </button>
  </nav>
</div>

<dialog id="form-dialog">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="form-title">Новый товар</h3>
      <button class="icon-btn" onclick="closeForm()">✕</button>
    </div>
    <input type="hidden" id="f-id">

    <div class="photo-block">
      <div class="photo-preview" id="f-photo-preview">📷</div>
      <div class="photo-actions">
        <button type="button" class="ghost" onclick="document.getElementById('f-photo-input').click()">📷 Сделать фото</button>
        <button type="button" class="text" id="f-photo-remove" style="display:none" onclick="removePhoto()">Удалить фото</button>
        <input type="file" id="f-photo-input" accept="image/*" capture="environment" style="display:none" onchange="capturePhoto(event)">
      </div>
    </div>

    <div class="field">
      <label>Название товара</label>
      <input type="text" id="f-name" placeholder="напр. Fresco 120x60">
    </div>
    <div class="row2">
      <div class="field">
        <label>Категория</label>
        <select id="f-cat">
          <option value="Кафель">Кафель</option>
          <option value="Ламинат">Ламинат</option>
          <option value="Двери">Двери</option>
          <option value="Другое">Другое</option>
        </select>
      </div>
      <div class="field">
        <label>Остаток (необязательно)</label>
        <input type="text" id="f-qty" placeholder="напр. 32">
      </div>
    </div>
    <div class="field">
      <label>Место на складе</label>
      <input type="text" id="f-loc" placeholder="напр. Стеллаж 3, полка 2">
    </div>
    <button class="primary" onclick="saveItem()">Сохранить</button>
  </div>
</dialog>

<dialog id="detail-dialog">
  <div class="detail-photo" id="d-photo">📦</div>
  <div class="detail-body">
    <div class="detail-head">
      <h3 id="d-name"></h3>
      <button class="icon-btn" onclick="document.getElementById('detail-dialog').close()">✕</button>
    </div>
    <div class="detail-row"><span class="k">Категория</span><span class="v" id="d-cat"></span></div>
    <div class="detail-row"><span class="k">Место на складе</span><span class="v" id="d-loc"></span></div>
    <div class="detail-row" id="d-qty-row"><span class="k">Остаток</span><span class="v" id="d-qty"></span></div>

    <!-- Интерактивное управление остатком через ползунок -->
    <div class="stock-control-box">
      <div class="stock-title">
        <span>Изменение остатка</span>
        <span id="d-unit-label">шт.</span>
      </div>
      <div class="stock-slider-wrapper">
        <button class="stock-btn" onclick="adjustStock(-1)">−</button>
        <input type="range" id="d-stock-slider" min="0" max="500" value="0" oninput="onStockSliderChange(this.value)">
        <button class="stock-btn" onclick="adjustStock(1)">+</button>
      </div>
      <div class="stock-val-display" id="d-stock-val">0</div>
    </div>

    <div class="detail-actions">
      <button class="ghost" onclick="document.getElementById('detail-dialog').close(); openForm(currentDetailId)">✎ Изменить</button>
      <button class="ghost" onclick="document.getElementById('detail-dialog').close(); deleteItem(currentDetailId)">🗑 Удалить</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<dialog id="delivery-form-dialog">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="df-title">Новая поставка</h3>
      <button class="icon-btn" onclick="document.getElementById('delivery-form-dialog').close()">✕</button>
    </div>
    <input type="hidden" id="df-id">
    <div class="field">
      <label>Дата поставки</label>
      <input type="date" id="df-date">
    </div>
    <div class="field">
      <label>Что прибыло</label>
      <textarea id="df-note" rows="4" placeholder="напр. Fresco 120x60 — 12 пачек&#10;Ламинат Дуб Сонома — 8 уп" style="width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; background:#FCFBF9;"></textarea>
    </div>
    <div class="field">
      <label>Фото накладной (можно несколько)</label>
      <div class="photo-gallery" id="df-gallery"></div>
      <button type="button" class="ghost" onclick="document.getElementById('df-photo-input').click()">📷 Добавить фото</button>
      <input type="file" id="df-photo-input" accept="image/*" capture="environment" style="display:none" onchange="addDeliveryPhoto(event)">
    </div>
    <button class="primary" onclick="saveDelivery()">Сохранить</button>
  </div>
</dialog>

<dialog id="delivery-detail-dialog">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="dd-date"></h3>
      <button class="icon-btn" onclick="document.getElementById('delivery-detail-dialog').close()">✕</button>
    </div>
    <div id="dd-note" style="white-space:pre-wrap; font-size:14.5px; margin-bottom:14px;"></div>
    <div class="photo-gallery" id="dd-gallery"></div>
    <div class="detail-actions">
      <button class="ghost" onclick="document.getElementById('delivery-detail-dialog').close(); openDeliveryForm(currentDeliveryId)">✎ Изменить</button>
      <button class="ghost" onclick="document.getElementById('delivery-detail-dialog').close(); deleteDelivery(currentDeliveryId)">🗑 Удалить</button>
    </div>

</dialog>

  <button class="lb-close" onclick="closeLightbox()">✕</button>

</div>

<script>
const STORAGE_KEY = "sklad_items_v1";
let items = [];

const DELIVERIES_KEY = "sklad_deliveries_v1";
let deliveries = [];
function loadDeliveries(){
  try{ deliveries = JSON.parse(localStorage.getItem(DELIVERIES_KEY) || "[]"); }
  catch(e){ deliveries = []; }
}
function persistDeliveries(){
  localStorage.setItem(DELIVERIES_KEY, JSON.stringify(deliveries));
}

// ---------- PHOTO STORAGE ----------
let __dbPromise = null;
function openPhotoDB(){
  if(__dbPromise) return __dbPromise;
  __dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('sklad_photos_db', 1);
    req.onupgradeneeded = () => {
      if(!req.result.objectStoreNames.contains('photos')){
        req.result.createObjectStore('photos');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return __dbPromise;
}
async function savePhoto(id, dataUrl){
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').put(dataUrl, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getPhoto(id){
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('photos', 'readonly');
    const req = tx.objectStore('photos').get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deletePhoto(id){
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function resizeImage(file, maxDim=1080, quality=0.8){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      let {width, height} = img;
      if(width > height && width > maxDim){ height = height*maxDim/width; width = maxDim; }
      else if(height > maxDim){ width = width*maxDim/height; height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadItems(){
  try{
    items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){ items = []; }
}
function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function showScreen(name){
  document.getElementById('screen-calc').classList.toggle('active', name==='calc');
  document.getElementById('screen-store').classList.toggle('active', name==='store');
  document.getElementById('screen-deliveries').classList.toggle('active', name==='deliveries');
  document.getElementById('tab-calc').classList.toggle('active', name==='calc');
  document.getElementById('tab-store').classList.toggle('active', name==='store');
  document.getElementById('tab-deliveries').classList.toggle('active', name==='deliveries');
  const titles = { calc: 'Калькулятор плитки', store: 'База склада', deliveries: 'Поставки' };
  const subs = { calc: 'Кафель · ламинат · двери', store: 'Поиск товара по названию', deliveries: 'Приход товара и накладные' };
  document.getElementById('page-title').textContent = titles[name];
  document.getElementById('page-sub').textContent = subs[name];
  if(name==='store'){ renderItems(); }
  if(name==='deliveries'){ renderDeliveries(); }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- CALCULATOR ----------
function calcTiles(){
  const w = parseFloat(document.getElementById('c-w').value);
  const h = parseFloat(document.getElementById('c-h').value);
  const perPack = parseInt(document.getElementById('c-pack').value);
  const need = parseFloat(document.getElementById('c-need').value);
  const marginPct = parseFloat(document.getElementById('c-margin').value) || 0;

  if(!w || !h || !perPack || !need || w<=0 || h<=0 || perPack<=0 || need<=0){
    toast("Заполните все поля числами больше нуля");
    return;
  }

  const tileArea = (w/100) * (h/100);
  const neededWithMargin = need * (1 + marginPct/100);
  const tilesNeeded = Math.ceil(neededWithMargin / tileArea);
  const packs = Math.floor(tilesNeeded / perPack);
  const loose = tilesNeeded - packs*perPack;
  const covered = tilesNeeded * tileArea;

  document.getElementById('r-packs').textContent = packs;
  document.getElementById('r-loose').textContent = loose;

  let metaHtml = `Всего плиток: <b>${tilesNeeded}</b> · площадь одной плитки <b>${tileArea.toFixed(3)} м²</b>`;
  const overflow = covered - neededWithMargin;
  if(overflow > 0.005){
    metaHtml += `<br>Округлено до целой плитки: покроет <b>${covered.toFixed(2)} м²</b> вместо ${need} м² (плитку нельзя выдать по частям)`;
  }
  document.getElementById('r-meta').innerHTML = metaHtml;
  document.getElementById('c-result').style.display = 'block';
}

// ---------- WAREHOUSE ----------
function renderItems(){
  const q = (document.getElementById('search-input').value || "").trim().toLowerCase();
  const list = document.getElementById('items-list');
  const filtered = q
    ? items.filter(it => it.name.toLowerCase().includes(q) || (it.loc||"").toLowerCase().includes(q))
    : items.slice();

  filtered.sort((a,b) => a.name.localeCompare(b.name, 'ru'));

  document.getElementById('store-count').textContent = `${items.length} ${pluralPos(items.length)} в базе`;

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">${items.length===0 ? 'База пуста. Добавьте первый товар.' : 'Ничего не найдено'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(it => `
    <div class="item-row" onclick="showDetail('${it.id}')">
      <div class="item-thumb" id="thumb-${it.id}">${it.hasPhoto ? '' : '🔲'}</div>
      <div class="item-main">
        <div class="item-name">${escapeHtml(it.name)}<span class="item-cat">${escapeHtml(it.cat||'—')}</span></div>
        <div class="item-loc">📍 ${escapeHtml(it.loc || '—')}</div>
        ${it.qty !== undefined && it.qty !== '' ? `<div class="item-qty">Остаток: ${escapeHtml(it.qty)}</div>` : ''}
      </div>
      <div class="item-actions">
        <button class="icon-btn" onclick="event.stopPropagation(); openForm('${it.id}')">✎</button>
        <button class="icon-btn" onclick="event.stopPropagation(); deleteItem('${it.id}')">🗑</button>
      </div>
    </div>
  `).join('');

  filtered.filter(it => it.hasPhoto).forEach(it => {
    getPhoto(it.id).then(dataUrl => {
      if(!dataUrl) return;
      const el = document.getElementById(`thumb-${it.id}`);
      if(el){ el.style.backgroundImage = `url(${dataUrl})`; el.textContent = ''; }
    }).catch(()=>{});
  });
}

function pluralPos(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10===1 && mod100!==11) return 'позиция';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'позиции';
  return 'позиций';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function resetPhotoPreview(){
  const prev = document.getElementById('f-photo-preview');
  prev.style.backgroundImage = '';
  prev.textContent = '📷';
  document.getElementById('f-photo-remove').style.display = 'none';
}

function parseStockNumber(valStr) {
  if (!valStr) return 0;
  const match = String(valStr).match(/(\d+([\.,]\d+)?)/);
  return match ? parseFloat(match[1].replace(',', '.')) : 0;
}

let currentDetailId = null;
let currentStockUnit = '';

async function showDetail(id){
  const it = items.find(x => x.id === id);
  if(!it) return;
  currentDetailId = id;

  document.getElementById('d-name').textContent = it.name;
  document.getElementById('d-cat').textContent = it.cat || '—';
  document.getElementById('d-loc').textContent = it.loc || '—';
  
  const currentNum = parseStockNumber(it.qty);
  const unitMatch = String(it.qty || '').replace(/[\d\s\.,]+/g, '').trim();
  currentStockUnit = unitMatch || 'шт.';
  document.getElementById('d-unit-label').textContent = currentStockUnit;

  const slider = document.getElementById('d-stock-slider');
  slider.max = Math.max(100, currentNum * 2 || 100);
  slider.value = currentNum;

  document.getElementById('d-stock-val').textContent = `${currentNum} ${currentStockUnit}`;

  const qtyRow = document.getElementById('d-qty-row');
  if(it.qty !== undefined && it.qty !== ''){
    qtyRow.style.display = '';
    document.getElementById('d-qty').textContent = it.qty;
  } else {
    qtyRow.style.display = 'none';
  }

  const photoEl = document.getElementById('d-photo');
  photoEl.style.backgroundImage = '';
  photoEl.textContent = '📦';
  if(it.hasPhoto){
    const dataUrl = await getPhoto(id).catch(()=>null);
    if(dataUrl){
      photoEl.style.backgroundImage = `url(${dataUrl})`;
      photoEl.textContent = '';
    }
  }

  document.getElementById('detail-dialog').showModal();
}

function onStockSliderChange(val){
  const num = parseFloat(val) || 0;
  const formattedVal = currentStockUnit ? `${num} ${currentStockUnit}` : `${num}`;
  document.getElementById('d-stock-val').textContent = formattedVal;
  document.getElementById('d-qty').textContent = formattedVal;
  document.getElementById('d-qty-row').style.display = '';

  const it = items.find(x => x.id === currentDetailId);
  if(it){
    it.qty = formattedVal;
    persist();
    renderItems();
  }
}

function adjustStock(delta){
  const slider = document.getElementById('d-stock-slider');
  let currentVal = parseFloat(slider.value) || 0;
  let newVal = Math.max(0, currentVal + delta);
  if (newVal > parseFloat(slider.max)) {
    slider.max = newVal * 2;
  }
  slider.value = newVal;
  onStockSliderChange(newVal);
}

async function openForm(id){
  const dlg = document.getElementById('form-dialog');
  resetPhotoPreview();
  if(id){
    const it = items.find(x => x.id === id);
    document.getElementById('form-title').textContent = 'Изменить товар';
    document.getElementById('f-id').value = it.id;
    document.getElementById('f-name').value = it.name;
    document.getElementById('f-cat').value = it.cat || 'Кафель';
    document.getElementById('f-qty').value = it.qty || '';
    document.getElementById('f-loc').value = it.loc || '';
    if(it.hasPhoto){
      const dataUrl = await getPhoto(it.id).catch(()=>null);
      if(dataUrl){
        document.getElementById('f-photo-preview').style.backgroundImage = `url(${dataUrl})`;
        document.getElementById('f-photo-preview').textContent = '';
        document.getElementById('f-photo-remove').style.display = 'inline-block';
      }
    }
  } else {
    document.getElementById('form-title').textContent = 'Новый товар';
    document.getElementById('f-id').value = 'it_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    document.getElementById('f-name').value = '';
    document.getElementById('f-cat').value = 'Кафель';
    document.getElementById('f-qty').value = '';
    document.getElementById('f-loc').value = '';
  }
  dlg.showModal();
  setTimeout(()=>document.getElementById('f-name').focus(), 50);
}
function closeForm(){ document.getElementById('form-dialog').close(); }

async function capturePhoto(evt){
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  const id = document.getElementById('f-id').value;
  try{
    const dataUrl = await resizeImage(file);
    await savePhoto(id, dataUrl);
    document.getElementById('f-photo-preview').style.backgroundImage = `url(${dataUrl})`;
    document.getElementById('f-photo-preview').textContent = '';
    document.getElementById('f-photo-remove').style.display = 'inline-block';
    const it = items.find(x => x.id === id);
    if(it){ it.hasPhoto = true; persist(); }
    toast('Фото сохранено');
  }catch(e){
    toast('Не удалось сохранить фото');
  }
}

async function removePhoto(){
  const id = document.getElementById('f-id').value;
  await deletePhoto(id).catch(()=>{});
  resetPhotoPreview();
  const it = items.find(x => x.id === id);
  if(it){ it.hasPhoto = false; persist(); renderItems(); }
}

async function saveItem(){
  const name = document.getElementById('f-name').value.trim();
  const loc = document.getElementById('f-loc').value.trim();
  const cat = document.getElementById('f-cat').value;
  const qty = document.getElementById('f-qty').value.trim();
  const id = document.getElementById('f-id').value;

  if(!name || !loc){
    toast("Укажите название и место на складе");
    return;
  }

  const existing = items.find(x => x.id === id);
  if(existing){
    Object.assign(existing, {name, loc, cat, qty});
  } else {
    const photo = await getPhoto(id).catch(()=>null);
    items.push({ id, name, loc, cat, qty, hasPhoto: !!photo });
  }
  persist();
  closeForm();
  renderItems();
  toast("Сохранено");
}

function deleteItem(id){
  if(!confirm("Удалить эту позицию из базы?")) return;
  items = items.filter(x => x.id !== id);
  persist();
  deletePhoto(id).catch(()=>{});
  renderItems();
  toast("Удалено");
}

async function exportData(){
  toast('Готовим файл…');
  const withPhotos = await Promise.all(items.map(async it => {
    const copy = {...it};
    if(it.hasPhoto){
      const dataUrl = await getPhoto(it.id).catch(()=>null);
      if(dataUrl) copy.photo = dataUrl;
    }
    return copy;
  }));
  const blob = new Blob([JSON.stringify(withPhotos, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `sklad-baza-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const incoming = JSON.parse(reader.result);
      if(!Array.isArray(incoming)) throw new Error('bad format');
      let added = 0;
      for(const raw of incoming){
        if(!raw.name) continue;
        const id = 'it_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        let hasPhoto = false;
        if(raw.photo){
          await savePhoto(id, raw.photo).catch(()=>{});
          hasPhoto = true;
        }
        items.push({
          id, name: String(raw.name), loc: String(raw.loc||''), cat: String(raw.cat||'Другое'),
          qty: String(raw.qty||''), hasPhoto
        });
        added++;
      }
      persist();
      renderItems();
      toast(`Импортировано позиций: ${added}`);
    }catch(e){
      toast("Не удалось прочитать файл");
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

// ---------- DELIVERIES ----------
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function renderDeliveries(){
  const list = document.getElementById('deliveries-list');
  const sorted = deliveries.slice().sort((a,b) => (b.date+b.id).localeCompare(a.date+a.id));
  document.getElementById('deliveries-count').textContent =
    `${deliveries.length} ${deliveries.length===1?'поставка':'поставок'}`;

  if(sorted.length === 0){
    list.innerHTML = `<div class="empty">Пока нет ни одной поставки. Добавьте первую.</div>`;
    return;
  }

  list.innerHTML = sorted.map(d => `
    <div class="delivery-row" onclick="showDeliveryDetail('${d.id}')">
      <div class="delivery-date">📦 ${fmtDate(d.date)}</div>
      ${d.note ? `<div class="delivery-note">${escapeHtml(d.note)}</div>` : ''}
      <div class="delivery-meta">${(d.photoIds||[]).length} фото накладной</div>
    </div>
  `).join('');
}

let __dfPhotoIds = [];

function renderDfGallery(){
  const gallery = document.getElementById('df-gallery');
  gallery.innerHTML = __dfPhotoIds.map(pid => `
    <div class="gallery-tile" id="dftile-${pid}">
      <span class="rm" onclick="event.stopPropagation(); removeDeliveryPhoto('${pid}')">✕</span>
    </div>
  `).join('') + `<div class="gallery-tile add-tile" onclick="document.getElementById('df-photo-input').click()">+</div>`;

  __dfPhotoIds.forEach(pid => {
    getPhoto(pid).then(dataUrl => {
      if(!dataUrl) return;
      const el = document.getElementById(`dftile-${pid}`);
      if(el) el.style.backgroundImage = `url(${dataUrl})`;
    }).catch(()=>{});
  });
}

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function openDeliveryForm(id){
  const dlg = document.getElementById('delivery-form-dialog');
  if(id){
    const d = deliveries.find(x => x.id === id);
    document.getElementById('df-title').textContent = 'Изменить поставку';
    document.getElementById('df-id').value = d.id;
    document.getElementById('df-date').value = d.date;
    document.getElementById('df-note').value = d.note || '';
    __dfPhotoIds = (d.photoIds || []).slice();
  } else {
    document.getElementById('df-title').textContent = 'Новая поставка';
    document.getElementById('df-id').value = 'dl_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    document.getElementById('df-date').value = todayISO();
    document.getElementById('df-note').value = '';
    __dfPhotoIds = [];
  }
  renderDfGallery();
  dlg.showModal();
}
function closeDeliveryForm(){ document.getElementById('delivery-form-dialog').close(); }

async function addDeliveryPhoto(evt){
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  try{
    const dataUrl = await resizeImage(file);
    const photoId = 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    await savePhoto(photoId, dataUrl);
    __dfPhotoIds.push(photoId);
    renderDfGallery();
  }catch(e){
    toast('Не удалось сохранить фото');
  }
}

async function removeDeliveryPhoto(photoId){
  await deletePhoto(photoId).catch(()=>{});
  __dfPhotoIds = __dfPhotoIds.filter(p => p !== photoId);
  renderDfGallery();
}

function saveDelivery(){
  const id = document.getElementById('df-id').value;
  const date = document.getElementById('df-date').value || todayISO();
  const note = document.getElementById('df-note').value.trim();

  if(!note && __dfPhotoIds.length === 0){
    toast('Добавьте описание или хотя бы одно фото');
    return;
  }

  const existing = deliveries.find(x => x.id === id);
  const record = { id, date, note, photoIds: __dfPhotoIds.slice() };
  if(existing){ Object.assign(existing, record); }
  else { deliveries.push(record); }

  persistDeliveries();
  document.getElementById('delivery-form-dialog').close();
  renderDeliveries();
  toast('Поставка сохранена');
}

let currentDeliveryId = null;
async function showDeliveryDetail(id){
  const d = deliveries.find(x => x.id === id);
  if(!d) return;
  currentDeliveryId = id;

  document.getElementById('dd-date').textContent = '📦 ' + fmtDate(d.date);
  document.getElementById('dd-note').textContent = d.note || '(без описания)';

  const gallery = document.getElementById('dd-gallery');
  const photoIds = d.photoIds || [];
  gallery.innerHTML = photoIds.map(pid => `<div class="gallery-tile" id="ddtile-${pid}" onclick="openLightbox('${pid}')"></div>`).join('');
  photoIds.forEach(pid => {
    getPhoto(pid).then(dataUrl => {
      if(!dataUrl) return;
      const el = document.getElementById(`ddtile-${pid}`);
      if(el) el.style.backgroundImage = `url(${dataUrl})`;
    }).catch(()=>{});
  });

  document.getElementById('delivery-detail-dialog').showModal();
}

function deleteDelivery(id){
  if(!confirm('Удалить эту поставку вместе с фото накладной?')) return;
  const d = deliveries.find(x => x.id === id);
  if(d){ (d.photoIds||[]).forEach(pid => deletePhoto(pid).catch(()=>{})); }
  deliveries = deliveries.filter(x => x.id !== id);
  persistDeliveries();
  renderDeliveries();
  toast('Поставка удалена');
}

async function openLightbox(photoId){
  const dataUrl = await getPhoto(photoId).catch(()=>null);
  if(!dataUrl) return;
  document.getElementById('lightbox-img').src = dataUrl;
  document.getElementById('photo-lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('photo-lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
}

// init
loadItems();
renderItems();
loadDeliveries();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
